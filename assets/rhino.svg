    <polygon points="62,240 124,238 210,260 170,308 98,292 70,282" fill="#181040" opacity="0.26"/>
    <polygon points="124,238 170,230 192,228 210,260" fill="#ffffff" opacity="0.08"/>

    <!-- pescoço e sombra do peito -->
    <polygon points="250,210 300,190 280,280 218,322" fill="#181040" opacity="0.22"/>
    <polygon points="192,228 250,210 218,322 210,260" fill="#181040" opacity="0.12"/>

    <!-- cupim iluminado -->
    <polygon points="282,128 392,84 390,160" fill="#ffffff" opacity="0.26"/>
    <polygon points="282,128 390,160 300,190" fill="#ffffff" opacity="0.12"/>

    <!-- dorso -->
    <polygon points="392,84 520,116 470,210 390,160" fill="#ffffff" opacity="0.14"/>
    <polygon points="520,116 648,92 600,200 470,210" fill="#ffffff" opacity="0.19"/>
    <polygon points="648,92 722,162 660,260 600,200" fill="#181040" opacity="0.14"/>

