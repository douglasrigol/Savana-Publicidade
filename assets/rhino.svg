    <g stroke="#ede9fe" stroke-opacity="0.1" stroke-width="1.4">
      <path d="M58 132 L98 206 L62 240 M98 206 L120 206 M120 206 L146 206 L138 168 M146 206 L170 230 L98 206 M170 230 L178 196 M170 230 L192 228 L230 130 M192 228 L210 260 L124 238 L170 230 M62 240 L124 238 M210 260 L170 308 M210 260 L218 322 M230 130 L258 118 M258 118 L282 128 M192 228 L250 210 L230 130 M250 210 L282 128 M250 210 L300 190 M300 190 L282 128 M300 190 L390 160 L282 128 M390 160 L392 84 M390 160 L470 210 L392 84 M470 210 L520 116 M470 210 L600 200 L520 116 M600 200 L648 92 M600 200 L660 260 L722 162 M660 260 L730 258 M470 210 L330 250 L300 190 M330 250 L280 280 L300 190 M250 210 L280 280 L218 322 M330 250 L430 290 L280 280 M430 290 L470 210 M430 290 L520 280 L470 210 M520 280 L660 260 M520 280 L600 330 M520 280 L520 336 M430 290 L430 330 M280 280 L250 330 M660 260 L600 330 M660 260 L646 380"/>
    </g>

    <!-- olho -->
    <polygon points="186,222 198,219 200,229 189,232" fill="#160e35"/>
    <circle cx="191" cy="223.5" r="1.8" fill="#d8cffb"/>

    <!-- narina -->
    <polygon points="74,254 84,252 82,262" fill="#181040" opacity="0.5"/>
