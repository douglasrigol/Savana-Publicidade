<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" fill="none" role="img" aria-label="Rinoceronte facetado SAVANA">
  <defs>
    <linearGradient id="rhinoBase" x1="400" y1="60" x2="430" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.45" stop-color="#8b6cf0"/>
      <stop offset="1" stop-color="#3e2c8f"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="720" y1="150" x2="760" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d55d0"/>
      <stop offset="1" stop-color="#34246e"/>
    </linearGradient>
    <radialGradient id="humpLight" cx="0.45" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rhinoClip">
      <polygon points="70,282 62,240 58,132 120,206 138,168 178,196 230,130 252,84 282,128 392,84 520,116 648,92 722,162 730,258 700,420 712,470 640,470 646,380 600,330 560,340 572,452 516,452 520,336 430,330 372,332 386,446 330,446 332,330 300,326 312,466 252,466 250,330 218,322 170,308 98,292"/>
    </clipPath>
  </defs>

  <!-- cauda (atrás do corpo) -->
  <polygon points="716,150 748,290 760,406 734,400 702,236" fill="url(#tailGrad)"/>

  <!-- silhueta base -->
  <polygon points="70,282 62,240 58,132 120,206 138,168 178,196 230,130 252,84 282,128 392,84 520,116 648,92 722,162 730,258 700,420 712,470 640,470 646,380 600,330 560,340 572,452 516,452 520,336 430,330 372,332 386,446 330,446 332,330 300,326 312,466 252,466 250,330 218,322 170,308 98,292" fill="url(#rhinoBase)"/>

  <!-- facetas (recortadas pela silhueta) -->
  <g clip-path="url(#rhinoClip)">
    <!-- luz geral do dorso -->
    <rect x="0" y="0" width="820" height="560" fill="url(#humpLight)"/>

    <!-- chifres -->
    <polygon points="58,132 62,240 98,206" fill="#efe9fe" opacity="0.92"/>
    <polygon points="58,132 98,206 120,206" fill="#181040" opacity="0.32"/>
    <polygon points="120,206 138,168 146,206" fill="#e4dafc" opacity="0.9"/>
    <polygon points="138,168 178,196 146,206" fill="#181040" opacity="0.3"/>

    <!-- topo da cabeça e testa -->
    <polygon points="98,206 120,206 146,206 170,230" fill="#ffffff" opacity="0.18"/>
    <polygon points="146,206 178,196 170,230" fill="#ffffff" opacity="0.1"/>
    <polygon points="178,196 230,130 192,228 170,230" fill="#ffffff" opacity="0.2"/>

    <!-- orelha -->
    <polygon points="230,130 252,84 258,118" fill="#ffffff" opacity="0.22"/>
    <polygon points="252,84 282,128 258,118" fill="#181040" opacity="0.38"/>

    <!-- focinho e mandíbula -->
