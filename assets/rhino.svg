  <!-- contorno sutil -->
  <polygon points="70,282 62,240 58,132 120,206 138,168 178,196 230,130 252,84 282,128 392,84 520,116 648,92 722,162 730,258 700,420 712,470 640,470 646,380 600,330 560,340 572,452 516,452 520,336 430,330 372,332 386,446 330,446 332,330 300,326 312,466 252,466 250,330 218,322 170,308 98,292" stroke="#cdc2fa" stroke-opacity="0.18" stroke-width="1.5" fill="none"/>
</svg>
