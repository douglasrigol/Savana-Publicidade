<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="ec-haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#4c1d95" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ec-sphere" cx="0.5" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#120b24"/>
      <stop offset="0.55" stop-color="#080412"/>
      <stop offset="1" stop-color="#04020a"/>
    </radialGradient>
    <radialGradient id="ec-refl" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="ec-b70" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="ec-b45" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="ec-b26" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="ec-b14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="ec-b6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="ec-b2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="ec-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.88  0 0 0 0 1  0.4 0.4 0.4 0 0"/>
    </filter>
    <clipPath id="ec-above"><rect x="0" y="0" width="1200" height="520"/></clipPath>
    <clipPath id="ec-below"><rect x="0" y="520" width="1200" height="280"/></clipPath>
    <radialGradient id="ec-fade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ec-gm"><ellipse cx="600" cy="490" rx="590" ry="390" fill="url(#ec-fade)"/></mask>
  </defs>

  <!-- halo ambiente -->
  <ellipse cx="600" cy="480" rx="620" ry="420" fill="url(#ec-haze)"/>

  <!-- ====== REFLEXO (sino espelhado abaixo do horizonte) ====== -->
  <g clip-path="url(#ec-below)" opacity="0.45">
    <g transform="translate(0,996) scale(1,-0.86)">
      <circle cx="600" cy="435" r="225" fill="#6d28d9" opacity="0.3" filter="url(#ec-b70)"/>
      <circle cx="600" cy="435" r="165" fill="#7c3aed" opacity="0.42" filter="url(#ec-b45)"/>
      <circle cx="600" cy="435" r="122" fill="#a78bfa" opacity="0.5" filter="url(#ec-b26)"/>
      <circle cx="600" cy="435" r="98" fill="#c4b5fd" opacity="0.55" filter="url(#ec-b14)"/>
    </g>
  </g>
  <ellipse cx="600" cy="635" rx="225" ry="110" fill="url(#ec-refl)" filter="url(#ec-b26)" opacity="0.7"/>

  <!-- ====== SINO DE LUZ (acima do horizonte) ====== -->
  <g clip-path="url(#ec-above)">
    <circle cx="600" cy="435" r="280" fill="#5b21b6" opacity="0.5" filter="url(#ec-b70)"/>
    <circle cx="600" cy="435" r="200" fill="#6d28d9" opacity="0.62" filter="url(#ec-b45)"/>
    <circle cx="600" cy="435" r="145" fill="#8b5cf6" opacity="0.75" filter="url(#ec-b26)"/>
    <circle cx="600" cy="435" r="112" fill="#c4b5fd" opacity="0.85" filter="url(#ec-b14)"/>
    <circle cx="600" cy="435" r="97" fill="#ede9fe" opacity="0.85" filter="url(#ec-b6)"/>
  </g>

  <!-- flares largos atrás da esfera -->
  <ellipse cx="600" cy="522" rx="580" ry="40" fill="#5b21b6" opacity="0.6" filter="url(#ec-b70)"/>
  <ellipse cx="600" cy="521" rx="470" ry="22" fill="#7c3aed" opacity="0.75" filter="url(#ec-b45)"/>

  <!-- esfera escura tangente ao horizonte -->
  <circle cx="600" cy="435" r="85" fill="url(#ec-sphere)"/>

  <!-- aro quente envolvendo a esfera -->
  <circle cx="600" cy="435" r="90" fill="none" stroke="#ddd6fe" stroke-width="8" opacity="0.85" filter="url(#ec-b6)"/>
  <circle cx="600" cy="435" r="87" fill="none" stroke="#ffffff" stroke-width="2.6" opacity="0.95" filter="url(#ec-b2)"/>
  <!-- reforço de brilho na base do aro, onde encontra o flare -->
  <path d="M 528 480 A 87 87 0 0 0 672 480" fill="none" stroke="#ffffff" stroke-width="5" filter="url(#ec-b6)"/>

  <!-- ====== FLARE HORIZONTAL (núcleo brilhante) ====== -->
  <ellipse cx="600" cy="520" rx="380" ry="12" fill="#a78bfa" opacity="0.95" filter="url(#ec-b14)"/>
  <ellipse cx="600" cy="519" rx="290" ry="6" fill="#ede9fe" opacity="0.95" filter="url(#ec-b6)"/>
  <ellipse cx="600" cy="519" rx="195" ry="3" fill="#ffffff" filter="url(#ec-b2)"/>

  <!-- grain embutido, com fade radial para não marcar as bordas da imagem -->
  <rect width="1200" height="800" filter="url(#ec-grain)" opacity="0.065" mask="url(#ec-gm)"/>
</svg>
